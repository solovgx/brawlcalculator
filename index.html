<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrawlCalculator 1.1 beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a62f5; --bg2:#5f8fff; --panel:#ffffff; --ink:#1b1245; --muted:#5e5a85;
  --outline:#0b0720; --field:#f1f0fb; --yellow:#ffd21f; --yellow-ink:#1b1245;
  --purple:#7a47e6; --good:#0f8a5f; --warn:#c2410c; --hero:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#140c2e; --bg2:#2a1a5c; --panel:#241a4a; --ink:#f3efff; --muted:#aaa3d6;
    --field:#170f36; --good:#4ee0a6; --warn:#ffb36b;
  }
}
:root[data-theme="dark"]{
  --bg1:#140c2e; --bg2:#2a1a5c; --panel:#241a4a; --ink:#f3efff; --muted:#aaa3d6;
  --field:#170f36; --good:#4ee0a6; --warn:#ffb36b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--bg1)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font:700 16px/1.45 "Nunito",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 28px;position:relative;z-index:1}
.stroke{text-shadow:-2px -2px 0 var(--outline),2px -2px 0 var(--outline),-2px 2px 0 var(--outline),2px 2px 0 var(--outline),0 3px 0 var(--outline)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font:400 clamp(1.5rem,5vw,2rem)/1 "Lilita One",system-ui,sans-serif;color:var(--yellow);letter-spacing:.01em}
.logo span{color:#fff}
.ver{font:400 .95rem "Lilita One",sans-serif;background:var(--yellow);color:var(--yellow-ink);border:3px solid var(--outline);border-radius:999px;padding:2px 10px;box-shadow:0 3px 0 var(--outline)}
h1{font:400 clamp(2rem,7vw,3.4rem)/1.02 "Lilita One",system-ui,sans-serif;color:var(--hero);margin:10px 0 8px}
h1 em{font-style:normal;color:var(--yellow)}
h2{font:400 1.35rem/1.2 "Lilita One",sans-serif;margin:0 0 10px;letter-spacing:.01em}
.chip{display:inline-block;font:400 1rem "Lilita One",sans-serif;background:var(--purple);color:#fff;border:3px solid var(--outline);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--outline);margin-left:6px;vertical-align:middle}
.chip.p2{background:#e5483d;color:#fff}
.chip.p3{background:#ffd21f;color:#fff;text-shadow:-1px -1px 0 var(--outline),1px -1px 0 var(--outline),-1px 1px 0 var(--outline),1px 1px 0 var(--outline),0 2px 0 var(--outline)}
.lead{color:#fff;opacity:.92;margin:0 0 18px;max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:620px){.modes{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{font:400 1.05rem/1.1 "Lilita One",sans-serif;color:#fff;background:var(--purple);border:3px solid var(--outline);border-radius:14px;padding:12px 6px 10px;box-shadow:0 5px 0 var(--outline);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 2px 0 var(--outline);transition:transform .08s,box-shadow .08s}
.mode .ic{font-size:1.7rem;line-height:1}
.mode[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink);text-shadow:none;transform:translateY(2px);box-shadow:0 3px 0 var(--outline),0 0 18px rgba(255,210,31,.6)}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{font:400 1rem "Lilita One",sans-serif;color:#fff;background:rgba(11,7,32,.45);border:3px solid var(--outline);border-radius:12px;padding:7px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(11,7,32,.78);color:var(--yellow);box-shadow:0 0 14px rgba(255,210,31,.5),inset 0 0 10px rgba(255,210,31,.18)}
.mode:focus-visible,.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #fff;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:800px){.grid{grid-template-columns:370px 1fr}}
.panel{background:var(--panel);border:3px solid var(--outline);border-radius:18px;padding:18px;box-shadow:0 6px 0 var(--outline)}
label{display:block;font-weight:800;font-size:.92rem;margin:12px 0 4px}
label small{color:var(--muted);font-weight:700}
input[type=number],textarea,.sel{width:100%;background:var(--field);color:var(--ink);border:3px solid var(--outline);border-radius:10px;padding:9px 10px;font:inherit}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;font-weight:600;resize:vertical;white-space:pre;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:14px;border-top:3px dashed var(--muted);padding-top:10px}
summary{cursor:pointer;font:400 1.05rem "Lilita One",sans-serif}
.go{margin-top:18px;width:100%;font:400 1.5rem "Lilita One",sans-serif;letter-spacing:.02em;color:var(--yellow-ink);background:var(--yellow);border:3px solid var(--outline);border-radius:14px;padding:12px;box-shadow:0 6px 0 var(--outline);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--outline)}
.go:disabled{opacity:.65;cursor:progress}
.mini{font:400 .95rem "Lilita One",sans-serif;background:var(--purple);color:#fff;border:3px solid var(--outline);border-radius:10px;padding:5px 10px;box-shadow:0 3px 0 var(--outline);cursor:pointer;margin:6px 6px 0 0}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.skill{font:400 .85rem/1.1 "Lilita One",sans-serif;color:#fff;background:var(--purple);border:3px solid var(--outline);border-radius:10px;padding:8px 2px;box-shadow:0 3px 0 var(--outline);cursor:pointer;text-shadow:0 1px 0 var(--outline)}
.skill[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink);text-shadow:none;transform:translateY(2px);box-shadow:0 1px 0 var(--outline),0 0 12px rgba(255,210,31,.6)}
.skill:focus-visible{outline:4px solid #fff;outline-offset:2px}
@media(max-width:420px){.skill{font-size:.72rem}}
.big{font:400 clamp(3rem,11vw,5rem)/1 "Lilita One",sans-serif;color:var(--ink)}
.big span{font-size:.36em;color:var(--muted);margin-left:.25em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--field);border:3px solid var(--outline);border-radius:12px;padding:8px 12px}
.stat b{display:block;font:400 1.4rem "Lilita One",sans-serif}
.stat em{font-style:normal;color:var(--muted);font-size:.82rem;font-weight:700}
.note{color:var(--muted);font-size:.9rem;margin-top:14px}
.warn{color:var(--warn);font-weight:800}
.tablewrap{overflow-x:auto;margin-top:14px;border:3px solid var(--outline);border-radius:12px;max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;text-align:right;border-bottom:2px solid var(--field);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--yellow);color:var(--yellow-ink);font:400 .95rem "Lilita One",sans-serif}
.bar{height:8px;background:var(--purple);border-radius:4px}
.hidden{display:none}
.progress{height:12px;background:var(--field);border:3px solid var(--outline);border-radius:8px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--yellow)}
footer{max-width:1000px;margin:0 auto;padding:18px 14px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;opacity:.9;font-size:.82rem;font-weight:700;position:relative;z-index:1}
footer b{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.02em}

/* ===== Brawl style v1.3 ===== */
body{
  background:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.22) 0 2px,transparent 3px) 0 0/34px 34px,
    radial-gradient(ellipse at 50% -10%,rgba(255,210,31,.35),transparent 55%),
    linear-gradient(170deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
.logo{transform:rotate(-2deg);font-size:clamp(1.8rem,6vw,2.5rem);text-shadow:-3px -3px 0 var(--outline),3px -3px 0 var(--outline),-3px 3px 0 var(--outline),3px 3px 0 var(--outline),0 5px 0 var(--outline)}
.ver{transform:rotate(4deg)}
.stroke{text-shadow:-3px -3px 0 var(--outline),3px -3px 0 var(--outline),-3px 3px 0 var(--outline),3px 3px 0 var(--outline),0 5px 0 var(--outline)}
h1{filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));letter-spacing:.01em}
.chip{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
.lead{font-size:1.05rem;text-shadow:0 2px 0 rgba(11,7,32,.45)}
.panel{border-width:4px;border-radius:24px;box-shadow:0 8px 0 var(--outline),0 14px 28px rgba(11,7,32,.35);overflow:hidden}
.panel > h2:first-child{background:linear-gradient(180deg,#3a2480,#24124f);color:var(--yellow);margin:-18px -18px 16px;padding:11px 18px;border-bottom:4px solid var(--outline);font-size:1.45rem;text-shadow:-2px -2px 0 var(--outline),2px -2px 0 var(--outline),-2px 2px 0 var(--outline),2px 2px 0 var(--outline),0 3px 0 var(--outline);letter-spacing:.02em}
.mode,.tab,.mini,.skill{transition:transform .08s,box-shadow .08s,filter .12s}
.mode{background:linear-gradient(180deg,#a070ff,#6a36d6);border-width:4px;border-radius:16px;box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.2),0 6px 0 var(--outline)}
.mode:hover{filter:brightness(1.12);transform:translateY(-2px) rotate(-1deg)}
.mode[aria-pressed="true"]{background:linear-gradient(180deg,#fff07a,#ffc400);box-shadow:inset 0 4px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--outline),0 0 22px rgba(255,210,31,.75);transform:translateY(3px)}
.mode:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 1px 0 var(--outline)}
.tab{border-radius:14px;border-width:4px;padding:8px 16px;background:rgba(11,7,32,.55)}
.tab:hover{filter:brightness(1.25)}
.skill{background:linear-gradient(180deg,#a070ff,#6a36d6);border-width:4px;border-radius:12px;padding:9px 4px;font-size:.95rem;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--outline)}
.skill:hover{filter:brightness(1.12);transform:translateY(-2px)}
.skill[aria-pressed="true"]{background:linear-gradient(180deg,#fff07a,#ffc400);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 1px 0 var(--outline),0 0 14px rgba(255,210,31,.7)}
.skill:nth-child(1){grid-column:1/-1}
input[type=number],textarea,.sel{border-width:4px;border-radius:12px;box-shadow:inset 0 3px 0 rgba(11,7,32,.12)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid var(--yellow)}
.mini{background:linear-gradient(180deg,#a070ff,#6a36d6);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 var(--outline)}
summary{color:var(--ink)}
.go{background:linear-gradient(180deg,#9cf04a,#3fb41c);color:#fff;font-size:1.8rem;border-width:4px;border-radius:18px;padding:13px;box-shadow:inset 0 5px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.18),0 7px 0 var(--outline);text-shadow:-2px -2px 0 var(--outline),2px -2px 0 var(--outline),-2px 2px 0 var(--outline),2px 2px 0 var(--outline),0 3px 0 var(--outline);transition:transform .08s,box-shadow .08s,filter .12s}
.go:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
.go:active{transform:translateY(5px);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),0 2px 0 var(--outline)}
.big{font-size:clamp(3.4rem,12vw,5.6rem);color:#fff;text-shadow:-3px -3px 0 var(--outline),3px -3px 0 var(--outline),-3px 3px 0 var(--outline),3px 3px 0 var(--outline),0 6px 0 var(--outline);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.big span{color:var(--yellow);text-shadow:-2px -2px 0 var(--outline),2px -2px 0 var(--outline),-2px 2px 0 var(--outline),2px 2px 0 var(--outline),0 3px 0 var(--outline)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.stat{border-width:4px;border-radius:14px;box-shadow:0 4px 0 var(--outline);background:var(--field)}
.stat b{color:var(--ink)}
.tablewrap{border-width:4px;border-radius:14px}
th{border-bottom:3px solid var(--outline)}
.progress{border-width:4px;height:16px}
.progress i{background:repeating-linear-gradient(135deg,#ffd21f 0 12px,#ffb800 12px 24px);transition:width .15s;animation:barmove .8s linear infinite;background-size:34px 34px}
@keyframes barmove{to{background-position:34px 0}}
.bar{background:linear-gradient(180deg,#a070ff,#6a36d6);border:2px solid var(--outline);height:12px}
footer{text-shadow:0 2px 0 rgba(11,7,32,.5)}

/* ===== wybor rang ===== */
.rkpick{margin-top:4px}
.rks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rk{--a:#999;--b:#555;display:flex;flex-direction:column;align-items:center;gap:1px;border:4px solid var(--outline);border-radius:14px 14px 22px 22px;background:linear-gradient(180deg,var(--a),var(--b));color:#fff;font:400 .74rem/1.05 "Lilita One",sans-serif;padding:7px 1px 6px;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--outline);text-shadow:-1px -1px 0 var(--outline),1px -1px 0 var(--outline),-1px 1px 0 var(--outline),1px 1px 0 var(--outline);filter:saturate(.7) brightness(.9);transition:transform .08s,filter .12s}
.rk i{font-style:normal;font-size:1.4rem;line-height:1.1}
.rk:hover{filter:saturate(1) brightness(1.05);transform:translateY(-2px)}
.rk[aria-pressed="true"]{filter:none;transform:translateY(2px) scale(1.05);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 1px 0 var(--outline),0 0 0 3px #fff,0 0 16px var(--a)}
.rk[aria-pressed="true"] i{animation:starspin 2.4s ease-in-out infinite}
@keyframes starspin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(25deg) scale(1.25)}}
.rk:focus-visible,.tier:focus-visible{outline:4px solid #fff;outline-offset:2px}
.tiers{display:flex;gap:8px;margin-top:10px}
.tier{--a:#999;--b:#555;flex:1;font:400 1.1rem "Lilita One",sans-serif;color:#fff;background:rgba(11,7,32,.45);border:4px solid var(--outline);border-radius:12px;padding:4px 0;cursor:pointer;box-shadow:0 3px 0 var(--outline)}
.tier[aria-pressed="true"]{background:linear-gradient(180deg,var(--a),var(--b));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 1px 0 var(--outline);transform:translateY(2px);text-shadow:-1px -1px 0 var(--outline),1px -1px 0 var(--outline),-1px 1px 0 var(--outline),1px 1px 0 var(--outline)}
.rkinfo{margin:8px 0 0;font:400 1.05rem "Lilita One",sans-serif;color:var(--ink)}
.rkinfo small{font:700 .85rem "Nunito",sans-serif;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--outline);margin-right:6px;vertical-align:-2px}

/* ===== animowane tlo ===== */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg::before{content:"";position:absolute;inset:-100px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 22px,rgba(255,255,255,0) 22px 44px);animation:stripes 3s linear infinite}
@keyframes stripes{to{transform:translate(31.1px,31.1px)}}
.bg .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5}
.bg .o1{width:340px;height:340px;background:#ffd21f;left:-80px;top:10%;animation:drift1 18s ease-in-out infinite alternate}
.bg .o2{width:420px;height:420px;background:#a070ff;right:-120px;top:35%;animation:drift2 22s ease-in-out infinite alternate}
.bg .o3{width:300px;height:300px;background:#3fb41c;left:30%;bottom:-120px;opacity:.35;animation:drift1 26s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(160px,-90px) scale(1.2)}}
@keyframes drift2{to{transform:translate(-200px,70px) scale(.85)}}
.bg .sym{position:absolute;bottom:-60px;opacity:.24;color:#ffd21f;animation:rise linear infinite;filter:drop-shadow(0 3px 0 rgba(11,7,32,.35))}
@keyframes rise{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,-60vh) rotate(180deg)}100%{transform:translate(-20px,-125vh) rotate(360deg)}}

/* ===== animacje wejscia i interakcji ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.brand{animation:fadeUp .5s backwards}
h1{animation:fadeUp .6s .06s backwards}
.lead{animation:fadeUp .6s .12s backwards}
.grid > .panel:nth-child(1){animation:fadeUp .6s .2s backwards}
.grid > .panel:nth-child(2){animation:fadeUp .6s .32s backwards}
.mode.enter{animation:popIn .5s cubic-bezier(.2,1.5,.4,1) backwards}
#out > *{animation:fadeUp .4s backwards}
#out .stat{animation:popIn .45s cubic-bezier(.2,1.5,.4,1) backwards}
#out .stat:nth-child(2){animation-delay:.06s}#out .stat:nth-child(3){animation-delay:.12s}
#out .stat:nth-child(4){animation-delay:.18s}#out .stat:nth-child(5){animation-delay:.24s}
#out .stat:nth-child(6){animation-delay:.3s}
#out tbody tr{animation:fadeUp .35s backwards}
.logo{animation:logoWob 4s ease-in-out infinite}
@keyframes logoWob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1deg) translateY(-3px)}}
.go{position:relative;overflow:hidden}
.go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;pointer-events:none}
.go:disabled::after{animation-duration:.7s}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.ver{animation:verTilt 5s ease-in-out infinite}
@keyframes verTilt{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-2deg) scale(1.06)}}

/* ===== jezyk + youtube ===== */
.lang{display:flex;gap:6px}
.lg{font:400 .95rem "Lilita One",sans-serif;color:#fff;background:rgba(11,7,32,.55);border:3px solid var(--outline);border-radius:10px;padding:4px 11px;cursor:pointer;transition:transform .08s,filter .12s}
.lg:hover{filter:brightness(1.3);transform:translateY(-2px)}
.lg[aria-pressed="true"]{background:linear-gradient(180deg,#fff07a,#ffc400);color:var(--yellow-ink);box-shadow:0 0 14px rgba(255,210,31,.7)}
.yt{display:inline-flex;align-items:center;gap:6px;font:400 .95rem "Lilita One",sans-serif;color:#fff;text-decoration:none;background:linear-gradient(180deg,#ff6b5e,#e5271c);border:3px solid var(--outline);border-radius:10px;padding:4px 11px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 var(--outline);text-shadow:0 2px 0 var(--outline);transition:transform .08s,filter .12s}
.yt:hover{filter:brightness(1.12);transform:translateY(-2px) rotate(-1deg)}
.yt i{font-style:normal;display:inline-block;animation:ytpulse 1.6s ease-in-out infinite}
@keyframes ytpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
footer a{color:var(--yellow);text-decoration:none;font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.02em}
footer a:hover{text-decoration:underline}
footer .made{margin-top:8px;font-size:.95rem}

/* ===== okienko suba ===== */
.mback{position:fixed;inset:0;background:rgba(11,7,32,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.mback.show{opacity:1;visibility:visible;transition:opacity .25s}
.modal{max-width:420px;width:100%;text-align:center;transform:scale(.6) rotate(-4deg);transition:transform .4s cubic-bezier(.2,1.6,.4,1);background:var(--panel);border:4px solid var(--outline);border-radius:24px;padding:22px;box-shadow:0 8px 0 var(--outline),0 0 40px rgba(255,210,31,.4)}
.mback.show .modal{transform:none}
.bell{font-size:3.4rem;line-height:1.1;display:inline-block;transform-origin:50% 0;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}

  const MODES = {

  const nPlaces = m => m.table.split('\n')[0].trim().split(/\s+/).length - 1;

  function weights(n, k){
    const w = Array.from({length:n}, (_, i) => Math.exp(-k * i));
    const s = w.reduce((a,b) => a+b, 0);
    return w.map(x => x / s * 100);
  }
  const SKILLS = [
    {key:'none',  shift:0,    k:0, none:true},

  function adjWR(wr, s){
    if(s.pro) return 0.99;
    const p = Math.min(0.999, Math.max(0.001, wr));
    return 1 / (1 + Math.exp(-(Math.log(p / (1 - p)) + s.shift)));
  }
  function skillChances(n, s){
    if(s.pro){

    return weights(n, s.k);
  }
  function tiltPlaces(w, s){
    if(s.pro) return skillChances(w.length, s).map(x => x / 100);
    if(!s.k) return w;
    const t = w.map((x, i) => x * Math.exp(-s.k * i));
    const sum = t.reduce((a, b) => a + b, 0);
    return t.map(x => x / sum);
  }

  // ---- wybor rang
  function buildPicker(boxId, inputId){
    const box = $(boxId), elo = +$(inputId).value || 0, ti = tierOf(elo), br = ti >= 21 ? 7 : Math.floor(ti / 3);

  function parseRows(text, minLen){
    return text.split('\n').map(l => l.trim().split(/\s+/).map(x => Number(x.replace(',', '.')))).filter(r => r.length >= minLen && r.every(x => !isNaN(x)));
  }

  function baseConfig(){
    const target = Math.max(1, +$('target').value);
    const start = Math.max(0, +$('start').value);
    if(start >= target) throw new Error(tr('errGoal'));
    const c = {target, start, mlen: +$('mlen').value, sims: Math.max(100, +$('sims').value|0), maxM: 20000};
    const sFrom = +$('sFrom').value, sBonus = +$('sBonus').value, sCap = +$('sCap').value;
    c.streakMax = +$('sMax').value;
    c.bonus = new Int16Array(200);
    for(let s = 0; s < 200; s++) c.bonus[s] = s >= sFrom ? Math.min(sBonus + (s - sFrom), sCap) : 0;
    return c;
  }

  function lookup(rows, target, col){
    const arr = new Int16Array(target + 1);
    let ri = 0;
    for(let tt = 0; tt <= target; tt++){
      while(ri+1 < rows.length && rows[ri+1][0] <= tt) ri++;
      arr[tt] = rows[ri][0] <= tt ? rows[ri][col] : 0;
    }
    return arr;
  }

  function readWL(){
    const c = baseConfig();
    const rows = parseRows($('tbl').value, 3).sort((a,b) => a[0]-b[0]);
    if(!rows.length) throw new Error(tr('errTbl'));
    c.winArr = lookup(rows, c.target, 1);
    c.lossArr = lookup(rows, c.target, 2);
    c.split = Math.max(1, +$('split').value || 1);
    c.scale = 1 / c.split;
    return c;
  }

  function readPlace(needChances){
    const c = baseConfig();
    const rows = parseRows($('plTbl').value, 3).sort((a,b) => a[0]-b[0]);
    if(!rows.length) throw new Error(tr('errPlTbl'));
    const N = rows[0].length - 1;
    if(rows.some(r => r.length !== N + 1)) throw new Error(tr('errCols'));
    c.N = N;
    c.dArr = [];
    for(let p = 0; p < N; p++) c.dArr.push(lookup(rows, c.target, p + 1));
    c.winPlace = Math.max(0, +$('sPlace').value | 0);
    if(needChances){
      const ch = parseRows($('chTbl').value, 2);
      if(ch.length !== N) throw new Error(tr('errCh', N));
      const sum = ch.reduce((a,r) => a + r[1], 0);
      if(sum <= 0) throw new Error(tr('errChSum'));
      c.chances = ch.map(r => r[1] / sum);
      let acc = 0; c.cum = c.chances.map(x => (acc += x)); c.cum[N-1] = 1;
      c.expStart = c.chances.reduce((a,x,p) => a + x * c.dArr[p][Math.min(c.start, c.target)], 0);
    }
    return c;
  }

  function onceWL(wr, c){
    let t = c.start, s = 0, n = 0;
    while(t < c.target && n < c.maxM){
      n++;
      const i = t | 0;
      if(Math.random() < wr){
        s++;
        const b = i < c.streakMax ? c.bonus[s > 199 ? 199 : s] : 0;
        t += (c.winArr[i] + b) * c.scale;
      } else {
        s = 0;
        t -= c.lossArr[i] * c.scale; if(t < 0) t = 0;
      }
    }
    return t >= c.target ? n : -1;
  }
  function oncePlace(c){
    let t = c.start, s = 0, n = 0;
    while(t < c.target && n < c.maxM){
      n++;
      const i = t | 0;
      const r = Math.random();
      let p = 0; while(r > c.cum[p]) p++;
      let d = c.dArr[p][i];
      if(c.winPlace > 0){
        if(p + 1 <= c.winPlace){ s++; if(i < c.streakMax) d += c.bonus[s > 199 ? 199 : s]; }
        else s = 0;
      }
      t += d; if(t < 0) t = 0;
    }
    return t >= c.target ? n : -1;
  }

  // ---- Ranked
  function roundsBo3(sw){
    let lo = 0, hi = 1;
    for(let i = 0; i < 40; i++){ const q = (lo + hi) / 2; if(q * q * (3 - 2 * q) < sw) lo = q; else hi = q; }
    const q = (lo + hi) / 2;
    return 2 + 2 * q * (1 - q);
  }
  function readRank(){
    const c = baseConfig();
    c.streakMax = 0;
    const rows = parseRows($('tbl').value, 3).sort((a,b) => a[0]-b[0]);
    if(!rows.length) throw new Error(tr('errElo'));
    c.winArr = lookup(rows, c.target, 1);
    c.lossArr = lookup(rows, c.target, 2);
    c.brOf = new Uint8Array(c.target + 1);
    for(let i = 0; i <= c.target; i++) c.brOf[i] = bracketOf(i);
    c.draft = Math.max(0, +$('draftMin').value || 0);
    c.lobby = Math.max(0, +$('lobbyMin').value || 0);
    c.boostPct = Math.max(0, +$('boostPct').value || 0);
    c.boostUntil = THR[+$('boostTo').value] || 0;
    c.goalName = (THR.indexOf(c.target) >= 0 ? tr('rankPrefix') : '') + goalName(c.target);
    return c;
  }
  function onceRank(wr, c){
    const br = new Float64Array(8);
    let t = c.start, n = 0, min = 0, rnd = 0, fl = 0;
    const b0 = c.brOf[t | 0]; if(b0 <= 3) fl = BR_START[b0];
    while(t < c.target && n < c.maxM){
      n++;
      const i = t | 0, b = c.brOf[i], mm = c.serMin[b];
      min += mm; br[b] += mm; rnd += c.serR[b];
      if(Math.random() < wr){
        let g = c.winArr[i];
        if(c.boostPct > 0 && i < c.boostUntil) g = Math.floor(g * (1 + c.boostPct / 100));
        t += g;
        if(t < c.target){ const bb = c.brOf[t | 0]; if(bb <= 3 && BR_START[bb] > fl) fl = BR_START[bb]; }
      } else {
        t -= c.lossArr[i]; if(t < fl) t = fl; if(t < 0) t = 0;
      }
    }
    return {ok: t >= c.target, n, min, br, rnd};
  }

  const fmtN = n => isFinite(n) ? Math.round(n).toLocaleString(LOC()) : '-';
  const hoursOf = (n, c) => n * c.mlen / 60;
  const fmtH = (n, c) => isFinite(n) ? dc(hoursOf(n, c).toFixed(1)) : '-';
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const title = c => '<h2>' + tr('resTitle', c.goalName || c.target.toLocaleString(LOC()) + ' ' + tr('trophies')) + '</h2>';
  const bigHTML = (hours, label) => '<div class="big"' + (isFinite(hours) ? ' data-v="' + hours + '"' : '') + '>' + (isFinite(hours) ? dc(hours.toFixed(1)) : '-') + '<span>' + label + '</span></div>';

  function showRank(c){
    const s = curSkill();
    const wr = adjWR(+$('wr').value / 100, s);
    const r3 = roundsBo3(wr);
    const bo1 = c.lobby + c.mlen, dr = c.draft + c.mlen;
    c.serMin = [bo1, bo1, bo1, dr, c.draft * 1.5 + r3 * c.mlen, c.draft * 1.5 + r3 * c.mlen, c.draft * 1.5 + r3 * c.mlen, c.draft * 1.5 + r3 * c.mlen];
    c.serR = [1, 1, 1, 1, r3, r3, r3, r3];
    const mins = [], sumBr = new Float64Array(8); let sumN = 0, sumR = 0, fail = 0;
    for(let i = 0; i < c.sims; i++){
      const r = onceRank(wr, c);
      if(!r.ok){ fail++; continue; }
      mins.push(r.min); sumN += r.n; sumR += r.rnd;
      for(let b = 0; b < 8; b++) sumBr[b] += r.br[b];
    }
    let html = title(c);
    if(!mins.length || fail / c.sims > 0.5){
      html += '<p class="warn">' + tr('warnRank') + '</p>';
      $('out').innerHTML = html; return;
    }
    mins.sort((a,b) => a-b);
    const ok = mins.length, mean = mins.reduce((a,b) => a+b, 0) / ok;
    const q = p => mins[Math.min(ok-1, Math.floor(p*ok))];
    const H = m => dc((m / 60).toFixed(1));
    html += bigHTML(mean / 60, tr('hrsAvg'));
    html += '<div class="stats">'
      + '<div class="stat"><b>' + fmtN(sumN / ok) + '</b><em>' + tr('rkMatches') + '</em></div>'
      + '<div class="stat"><b>' + fmtN(sumR / ok) + '</b><em>' + tr('rkRounds') + '</em></div>'
      + '<div class="stat"><b>' + dc((wr * 100).toFixed(1)) + '%</b><em>' + tr('rkWr') + '</em></div>'
      + '<div class="stat"><b>' + H(q(.1)) + ' h</b><em>' + tr('lucky') + '</em></div>'
      + '<div class="stat"><b>' + H(q(.5)) + ' h</b><em>' + tr('median') + '</em></div>'
      + '<div class="stat"><b>' + H(q(.9)) + ' h</b><em>' + tr('unlucky') + '</em></div>'
      + '</div>';
    const avgBr = Array.from(sumBr, v => v / ok), maxBr = Math.max(...avgBr);
    html += '<h2 style="margin-top:18px">' + tr('whereTime') + '</h2><div class="tablewrap"><table><thead><tr><th>' + tr('thRank') + '</th><th>' + tr('thHours') + '</th><th></th></tr></thead><tbody>';
    let ri = 0;
    avgBr.forEach((v, b) => {
      if(v <= 0) return;
      html += '<tr style="animation-delay:' + (ri++ * 70) + 'ms"><td><span class="dot" style="background:' + RK_COL[b][0] + '"></span>' + brn(b) + '</td><td>' + H(v) + '</td><td style="width:110px"><div class="bar" style="width:' + Math.max(3, v / maxBr * 100) + 'px;background:linear-gradient(180deg,' + RK_COL[b][0] + ',' + RK_COL[b][1] + ')"></div></td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="note">' + tr('rkNote1', c.sims.toLocaleString(LOC()), skName(s)) + (c.boostPct > 0 ? tr('rkBoostNote', c.boostPct, goalName(c.boostUntil)) : '') + tr('rkNote2') + '</p>';
    $('out').innerHTML = html;
  }

  function simulate(fn, c){
    const res = []; let fail = 0;
    for(let i = 0; i < c.sims; i++){ const n = fn(); if(n < 0) fail++; else res.push(n); }
    res.sort((a,b) => a-b);
    if(!res.length) return {mean: Infinity, p10: Infinity, med: Infinity, p90: Infinity, fail: 1};
    const mean = res.reduce((a,b) => a+b, 0) / res.length;
    const q = p => res[Math.min(res.length-1, Math.floor(p*res.length))];
    return {mean, p10: q(.1), med: q(.5), p90: q(.9), fail: fail / c.sims};
  }
  const meanOf = r => r.fail > 0.5 ? Infinity : r.mean;

  function parseData(text){
    const tok = text.split(/\s+/).filter(Boolean);
    const isNum = x => /^\d+([.,]\d+)?$/.test(x);
    const out = []; let i = 0;
    while(i < tok.length){
      if(/^\d+$/.test(tok[i]) && i+1 < tok.length && !isNum(tok[i+1])) i++;
      const name = [];
      while(i < tok.length && !isNum(tok[i])) name.push(tok[i++]);
      const nums = [];
      while(i < tok.length && isNum(tok[i])) nums.push(tok[i++]);
      if(nums.length > 1 && /^\d+$/.test(nums[nums.length-1]) && i < tok.length){ nums.pop(); i--; }
      if(name.length && nums.length){
        out.push({name: name.join(' '), wr: parseFloat(nums[0].replace(',', '.')), pick: nums.length > 1 ? parseFloat(nums[1].replace(',', '.')) : 1});
      }
    }
    return out.filter(b => b.wr > 0 && b.wr < 100);
  }

  function fitCum(N, type, val){
    const wts = k => { const w = []; let s = 0; for(let i = 0; i < N; i++){ const x = Math.exp(-k * i); w.push(x); s += x; } return w.map(x => x / s); };
    const f = k => { const w = wts(k); return type === 'mean' ? w.reduce((a,x,i) => a + x * (i+1), 0) : w[0]; };
    const dec = type === 'mean';
    let lo = -4, hi = 8;
    const a = f(lo), b = f(hi);
    if(val <= Math.min(a,b) || val >= Math.max(a,b)) return null;
    for(let i = 0; i < 60; i++){
      const mid = (lo + hi) / 2, fm = f(mid);
      if(dec ? fm > val : fm < val) lo = mid; else hi = mid;
    }
    return wts((lo + hi) / 2);
  }

  const pause = () => new Promise(r => setTimeout(r, 0));

  function showOne(r, c, extra, note){
    let html = title(c);
    if(r.fail > 0.5){
      html += '<p class="warn">' + tr('warnGen') + '</p>';
    } else {
      html += bigHTML(hoursOf(r.mean, c), tr('hrsAvg'));
      html += '<div class="stats">'
        + '<div class="stat"><b>' + fmtN(r.mean) + '</b><em>' + tr('matchesAvg') + '</em></div>'
        + (extra || '')
        + '<div class="stat"><b>' + fmtH(r.p10, c) + ' h</b><em>' + tr('lucky') + '</em></div>'
        + '<div class="stat"><b>' + fmtH(r.med, c) + ' h</b><em>' + tr('median') + '</em></div>'
        + '<div class="stat"><b>' + fmtH(r.p90, c) + ' h</b><em>' + tr('unlucky') + '</em></div>'
        + '</div>';
      html += '<p class="note">' + tr('oneNote', c.sims.toLocaleString(LOC()), dc(c.mlen)) + (note || '') + '</p>';
    }
    $('out').innerHTML = html;
  }

  function renderBatch(c, rows, o){
    const ok = rows.filter(r => isFinite(r.mean));
    let html = title(c);
    if(!ok.length){
      html += '<p class="warn">' + tr('noneReach') + '</p>';
    } else {
      const sumAll = rows.reduce((a,r) => a + r.pick, 0);
      const sumPick = ok.reduce((a,r) => a + r.pick, 0);
      const simpleS = rows.reduce((a,r) => a + r.wr, 0) / rows.length;
      const weightedS = rows.reduce((a,r) => a + r.wr * r.pick, 0) / sumAll;
      const simpleT = ok.reduce((a,r) => a + r.mean, 0) / ok.length;
      const weightedT = ok.reduce((a,r) => a + r.mean * r.pick, 0) / sumPick;
      const maxMean = Math.max(...ok.map(r => r.mean));
      rows.sort((a,b) => a.mean - b.mean);
      html += bigHTML(hoursOf(weightedT, c), tr('wghtLbl'));
      html += '<div class="stats">'
        + '<div class="stat"><b>' + fmtH(simpleT, c) + ' h</b><em>' + tr('simpleTime') + '</em></div>'
        + '<div class="stat"><b>' + o.fmt(simpleS) + '</b><em>' + tr('simpleStat', o.lbl) + '</em></div>'
        + '<div class="stat"><b>' + o.fmt(weightedS) + '</b><em>' + tr('wStat', o.lbl) + '</em></div>'
        + '<div class="stat"><b>' + fmtN(weightedT) + '</b><em>' + tr('matchesW') + '</em></div>'
        + '</div>';
      html += '<div class="tablewrap"><table><thead><tr><th>' + tr('thBrawler') + '</th><th>' + o.col + '</th><th>' + tr('thPick') + '</th><th>' + tr('thMatches') + '</th><th>' + tr('thHours') + '</th><th></th></tr></thead><tbody>';
      rows.forEach((r, i) => {
        const w = isFinite(r.mean) ? Math.max(2, r.mean / maxMean * 80) : 0;
        html += '<tr style="animation-delay:' + Math.min(i * 20, 600) + 'ms"><td>' + esc(r.name) + '</td><td>' + o.fmt(r.wr) + '</td><td>' + dc(r.pick.toFixed(1)) + '%</td><td>' + fmtN(r.mean) + '</td><td>' + fmtH(r.mean, c) + '</td><td style="width:90px"><div class="bar" style="width:' + w + 'px"></div></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<p class="note">' + (o.note || '') + '</p>';
    $('out').innerHTML = html;
  }

  async function placeBatch(c){
    const type = $('statType').value;
    const list = parseData($('data').value);
    if(!list.length){
      $('out').innerHTML = '<h2>' + tr('resultH') + '</h2><p class="warn">' + tr('noBrPlace') + '</p>';
      return;
    }
    const N = c.N, rows = []; let skipped = 0;
    $('prog').classList.remove('hidden');
    for(let i = 0; i < list.length; i++){
      const b = list[i];
      const w0 = fitCum(N, type, type === 'mean' ? b.wr : b.wr / 100);
      const w = w0 ? tiltPlaces(w0, curSkill()) : null;
      if(w){
        let acc = 0; const cum = w.map(x => (acc += x)); cum[N-1] = 1;
        const cc = {...c, cum};
        rows.push({...b, mean: meanOf(simulate(() => oncePlace(cc), cc))});
      } else skipped++;
      $('progbar').style.width = ((i+1) / list.length * 100) + '%';
      if(i % 3 === 0) await pause();
    }
    $('prog').classList.add('hidden');
    if(!rows.length){
      $('out').innerHTML = '<h2>' + tr('resultH') + '</h2><p class="warn">' + tr('noFit', N) + '</p>';
      return;
    }
    renderBatch(c, rows, {
      col: type === 'mean' ? tr('colMean') : tr('colP1'),
      lbl: type === 'mean' ? tr('lblMean') : tr('lblP1'),
      fmt: v => type === 'mean' ? dc(v.toFixed(2)) : dc(v.toFixed(1)) + '%',
      note: tr('plBatchNote', skName(curSkill())) + (skipped ? tr('skipped', skipped) : '')
    });
  }

  async function wlBatch(c){
    const list = parseData($('data').value);
    if(!list.length){
      $('out').innerHTML = '<h2>' + tr('resultH') + '</h2><p class="warn">' + tr('noBrWl') + '</p>';
      return;
    }
    $('prog').classList.remove('hidden');
    const rows = [];
    for(let i = 0; i < list.length; i++){
      const wr = adjWR(list[i].wr / 100, curSkill());
      rows.push({...list[i], mean: meanOf(simulate(() => onceWL(wr, c), c))});
      $('progbar').style.width = ((i+1) / list.length * 100) + '%';
      if(i % 3 === 0) await pause();
    }
    $('prog').classList.add('hidden');
    const s = curSkill();
    renderBatch(c, rows, {
      col: tr('colWr'), lbl: tr('lblWr'),
      fmt: v => dc(v.toFixed(1)) + '%',
      note: tr('wlN1', skName(s)) + (s.none ? '.' : s.pro ? tr('wlNpro') : tr('wlNadj')) + tr('wlN2') + (c.split > 1 ? tr('splitRes', c.split) : '')
    });
  }

  // ================= ANIMACJE: odliczanie, konfetti, tlo =================
  function animateBig(){
    const el = document.querySelector('#out .big[data-v]');
    if(!el) return false;
    const v = +el.dataset.v, tn = el.firstChild;
    if(!tn || tn.nodeType !== 3 || !isFinite(v)) return false;
    if(RM) return true;
    const t0 = performance.now(), d = 900;
    (function f(now){
      const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3);
      tn.nodeValue = dc((v * e).toFixed(1));
      if(p < 1) requestAnimationFrame(f); else tn.nodeValue = dc(v.toFixed(1));
    })(t0);
    return true;
  }
  function confetti(){
    if(RM) return;
    const colors = ['#ffd21f','#a070ff','#9cf04a','#ff8a7e','#8be8ff','#ffffff'];
    const box = document.createElement('div'); box.className = 'confetti';
    for(let i = 0; i < 44; i++){
      const p = document.createElement('i');
      p.style.left = (50 + (Math.random() - .5) * 24) + '%';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', ((Math.random() - .5) * 700) + 'px');
      p.style.setProperty('--dy', (-120 - Math.random() * 320) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDelay = (Math.random() * .18) + 's';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2400);
  }
  (function buildBg(){
    const bg = $('bg'), sym = ['\u2605','\u{1F3C6}','\u{1F48E}','\u26A1','\u{1F525}','\u{1F4A5}'];
    for(let i = 0; i < 22; i++){
      const s = document.createElement('span'); s.className = 'sym';
      s.textContent = sym[i % sym.length];
      s.style.left = (Math.random() * 100) + '%';
      s.style.fontSize = (18 + Math.random() * 34) + 'px';
      s.style.animationDuration = (14 + Math.random() * 18) + 's';
      s.style.animationDelay = '-' + (Math.random() * 30) + 's';
      bg.appendChild(s);
    }
  })();

  // ================= OKIENKO SUBA (co 5. obliczenie) =================
  let calcCount = 0, lastFocus = null;
  try { calcCount = +localStorage.getItem('bc_calcs') || 0; } catch(e){}
  function bumpCount(){
    calcCount++;
    try { localStorage.setItem('bc_calcs', String(calcCount)); } catch(e){}
    return calcCount;
  }
  function showModal(){
    lastFocus = document.activeElement;
    $('mback').classList.add('show');
    setTimeout(() => $('mSub').focus(), 60);
  }
  function hideModal(){
    $('mback').classList.remove('show');
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('mClose').addEventListener('click', hideModal);
  $('mSub').addEventListener('click', () => setTimeout(hideModal, 250));
  $('mback').addEventListener('click', e => { if(e.target === $('mback')) hideModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('mback').classList.contains('show')) hideModal(); });

  // ================= PRZELACZNIK JEZYKA =================
  function setLang(l){
    lang = l;
    try { localStorage.setItem('bc_lang', l); } catch(e){}
    applyStatic();
    fillBoostSelect();
    renderSkills();
    applyMode(false);
  }
  document.querySelectorAll('.lg').forEach(b => b.addEventListener('click', () => { if(b.dataset.lang !== lang) setLang(b.dataset.lang); }));

  // ================= START OBLICZEN =================
  $('run').addEventListener('click', async () => {
    const btn = $('run'); const m = MODES[modeKey];
    const place = m.type === 'place';
    let c;
    try { c = m.type === 'rank' ? readRank() : place ? readPlace(tab === 'one') : readWL(); }
    catch(e){ $('out').innerHTML = '<h2>' + tr('resultH') + '</h2><p class="warn">' + e.message + '</p>'; return; }
    updateGoal();
    btn.disabled = true; btn.textContent = tr('running');
    await pause();

    if(m.type === 'rank'){
      showRank(c);
    } else if(place && tab === 'all'){
      await placeBatch(c);
    } else if(place){
      const stat = '<div class="stat"><b>' + (c.expStart >= 0 ? '+' : '') + dc(c.expStart.toFixed(1)) + '</b><em>' + tr('placeStart') + '</em></div>';
      showOne(simulate(() => oncePlace(c), c), c, stat, ' ' + tr('lvlN', skName(curSkill())) + '.' + (c.winPlace > 0 ? tr('streakPl', c.winPlace) : ''));
    } else if(tab === 'one'){
      const s = curSkill();
      const wr = adjWR(+$('wr').value / 100, s);
      showOne(simulate(() => onceWL(wr, c), c), c, '', ' ' + tr('lvlN', skName(s)) + (s.none ? '' : tr('lvlWr', dc((wr * 100).toFixed(1)))) + '.' + (c.split > 1 ? tr('splitRes', c.split) : ''));
    } else {
      await wlBatch(c);
    }
    btn.disabled = false; btn.textContent = tr('run');

    const hasResult = animateBig();
    if(hasResult) confetti();
    const n = bumpCount();
    if(n % 2 === 0) setTimeout(showModal, RM ? 300 : 1500);
  });

  applyStatic();
  fillBoostSelect();
  renderSkills();
  applyMode(true);
})();
</script>
